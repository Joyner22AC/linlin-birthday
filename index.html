<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#251913">
<title>Happy Birthday, Linlin!</title>
<link rel="preload" href="./assets/great-vibes.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./assets/noto-serif-sc-poems.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face {
  font-family: "Great Vibes";
  src: url("./assets/great-vibes.woff2") format("woff2");
  font-display: swap;
}
@font-face {
  font-family: "Noto Serif Poems";
  src: url("./assets/noto-serif-sc-poems.woff2") format("woff2");
  font-weight: 500;
  font-display: swap;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: #21140f; }
#stage { position: relative; height: 100vh; height: 100svh; overflow: hidden; touch-action: none;
  background: radial-gradient(ellipse at 50% 44%, #81573e, #281813 76%); cursor: grab; isolation: isolate; }
#stage canvas { display: block; width: 100%; height: 100%; }
#stage:is([data-phase="playing"], [data-phase="returning"]) { cursor: default; }
#stage.dragging { cursor: grabbing; }
.visually-hidden, #birthday-action:not(:focus-visible) {
  position: absolute; width: 1px; height: 1px; padding: 0; overflow: hidden;
  clip-path: inset(50%); white-space: nowrap; border: 0;
}
#birthday-action:focus-visible {
  position: absolute; z-index: 4; left: 50%; bottom: max(env(safe-area-inset-bottom), 24px);
  transform: translateX(-50%); width: max-content; max-width: 90%; min-height: 44px; padding: 8px 16px;
  color: #fff5dc; border: 1px solid #f8d194; border-radius: 24px; outline: 2px solid #f8d194;
  outline-offset: 4px; background: #24150d;
}
#words, #candlelight { position: absolute; inset: 0; pointer-events: none; }
#words {
  z-index: 2; display: flex; flex-direction: column; align-items: center;
  padding: max(4.8svh, 20px) 5vw 0;
}
#line {
  width: 100%; max-width: 940px; margin: 0; padding: .08em .16em; text-align: center; text-wrap: balance;
  font: 400 clamp(1.8rem, 4.4vw, 4.35rem)/1.16 "Great Vibes", "Segoe Script", cursive;
  color: #fff3cf; text-shadow: 0 0 .36em #f3a7488c, 0 2px 8px #361506; opacity: 0;
}
#line.poem-lead { font-size: clamp(1.6rem, 3.5vw, 3.3rem); }
#poem {
  margin: .35em 0 0; max-width: 100%; padding: 0 .2em; text-align: center;
  text-wrap: balance; opacity: 0;
  font: 500 clamp(1.24rem, 3.25vw, 2.5rem)/1.5 "Noto Serif Poems", "Songti SC", SimSun, serif;
  letter-spacing: .08em; color: #fff3cf; text-shadow: 0 0 12px #f1a84b8c, 0 2px 8px #361506;
}
#line.greeting { font-size: clamp(2.8rem, 7vw, 6.2rem); }
#candlelight {
  z-index: 3; opacity: 0;
  background: radial-gradient(circle at var(--light-x, 50%) var(--light-y, 40%),
    #fff8e8 0, #fff1cc 16%, #fbd59c 45%, #eaa866 100%);
}
#fallback-orb, #fallback-candle { display: none; }
#stage[data-flat] { background: center / cover no-repeat url("./assets/table-still.jpg"), #3f2a22; }
#stage[data-flat] canvas { display: none; }
#stage[data-flat]::before {
  content: ""; position: absolute; inset: 0; background: #1a100ded; opacity: var(--dark, 0);
}
#stage[data-flat][data-orb] { background: #180d12; }
#stage[data-flat][data-ignited]:not([data-orb]) #fallback-candle {
  display: block; position: absolute; left: 50%; top: 28%; width: 9px; height: 18px; translate: -50% -50%;
  border-radius: 70% 40% 60% 55%; background: #fff2b9; box-shadow: 0 0 38px 14px #f9ae4566;
}
#stage[data-flat][data-orb] #fallback-orb {
  display: block; position: absolute; left: 50%; top: 50%; translate: -50% -50%;
  width: min(40vw, 235px); aspect-ratio: 1;
  scale: calc(1 + var(--enter, 0) * 5); border: 1px solid #fff4ba; border-radius: 50%;
  background: radial-gradient(circle at 35% 27%, #fff7dc, #ffd681 35%, #c57023 82%, #ffe0a0);
  box-shadow: 0 0 80px 17px #f9ae4555;
}
@media (max-width: 620px) {
  #words { padding-top: 7svh; }
  #line { font-size: clamp(1.78rem, 7.8vw, 3rem); }
  #line.poem-lead { font-size: clamp(1.65rem, 7vw, 2.6rem); }
  #poem { font-size: clamp(1.2rem, 5.25vw, 1.9rem); }
  #line.greeting { font-size: clamp(2.65rem, 10.4vw, 4.6rem); }
  #stage[data-flat] { background-size: auto 76%; background-repeat: no-repeat; }
  #stage[data-flat][data-ignited]:not([data-orb]) #fallback-candle { top: 33%; }
}
</style>
</head>
<body>
<main id="stage" data-phase="ready" aria-label="Linlin’s birthday table">
  <div id="words" aria-hidden="true"><p id="line"></p><p id="poem" lang="zh-Hans" hidden></p></div>
  <div id="candlelight" aria-hidden="true"></div>
  <div id="fallback-candle" aria-hidden="true"></div>
  <div id="fallback-orb" aria-hidden="true"></div>
  <button type="button" id="birthday-action" disabled>Light the birthday candles</button>
  <p id="birthday-status" class="visually-hidden" role="status"></p>
</main>
<audio id="birthday-audio" src="./assets/birthday-loop.mp3" preload="auto"></audio>
<script type="module" src="./birthday.js?v=memory-loop"></script>
</body>
</html>
